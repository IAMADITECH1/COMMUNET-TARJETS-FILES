<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f6c5d3"><title>Registro de visitas | Bicha Studios</title><link rel="stylesheet" href="admin.css"></head>
<body><main class="admin-shell"><header class="admin-header"><img src="LOGO BICHA.png" alt="Bicha Studios" class="logo"><div><p class="eyebrow">Panel de administración</p><h1>Registrar visita</h1><p>Captura los datos después de escanear el QR de la clienta.</p></div></header>
<section class="admin-card"><div class="notice"><strong>Modo de prueba local</strong><span>Los registros se guardan temporalmente en este navegador.</span></div><form id="adminForm"><label for="adminKey">Clave de administradora</label><input id="adminKey" name="adminKey" type="password" placeholder="Ingresa tu clave" required><div class="form-grid"><div><label for="clientName">Nombre de la clienta</label><input id="clientName" name="clientName" type="text" placeholder="Ej. Mariana López" required></div><div><label for="clientFolio">Folio de la clienta</label><input id="clientFolio" name="clientFolio" type="text" placeholder="Ej. BS-0001" required></div></div><div class="form-grid"><div><label for="ticket">Folio del ticket</label><input id="ticket" name="ticket" type="text" placeholder="Ej. T-10482" required></div><div><label for="partner">Socia que realizó el servicio</label><input id="partner" name="partner" type="text" placeholder="Ej. Andrea" required></div></div><button type="submit">Registrar visita</button><p id="message" class="message" role="status"></p></form></section><section class="last-registration" aria-live="polite"><h2>Último registro</h2><p id="lastRegistration">Aún no hay visitas registradas.</p><a href="index.html">Ver tarjeta de fidelización</a></section></main><script src="admin.js"></script></body></html>
